  .toolbar input { flex: 1; min-width: 200px; max-width: 420px; }

  tbody td { padding: 8px 6px; border-bottom: 1px solid #eee; border-right: 1px solid #f1f5f9; text-align: center; vertical-align: middle; font-size: 14px; }
  tbody tr:hover { background: #fff7ed; }
  tbody tr.has-mean { background: #fffbf0; }
  .thai { font-size: 24px; font-weight: bold; line-height: 1.1; }
  .pinyin { color: #ff8a00; font-weight: bold; font-size: 13px; }
  .no-trans { color: #94a3b8; font-style: italic; }
  .remark { text-align: left; font-size: 13px; color: #475569; max-width: 260px; line-height: 1.4; }
  .play-btn { background: #ff8a00; color: white; border: none; border-radius: 999px; padding: 7px 12px; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .play-btn:hover { background: #e67a00; }
  .vowel-head { background: #fff3e0 !important; color: #9a3412 !important; font-weight: bold; white-space: nowrap; }
  .cons-head { background: #ff8a00; color: white; font-size: 20px; }
  .view-btn { background: #334155; color: white; border: none; padding: 10px 18px; border-radius: 999px; cursor: pointer; font-size: 15px; }
  .view-btn.active { background: #ff8a00; }
</style>
</head>

<h1>🇹🇭 泰文基礎字元 - 196 個完整版</h1>

<div style="text-align:center; margin: 12px 0;">

    <option value="has">只看有意思的</option>
    <option value="no">只看純發音練習</option>
  </select>

<div class="matrix-wrap" id="tableWrap">

    <tbody id="tableBody"></tbody>
  </table>
</div>
